<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resultados de evaluación · Chatbox de apoyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --ink: #1e2a28;
    --muted: #5c6b67;
    --accent: #3f6f63;
    --accent-ink: #ffffff;
    --accent-soft: #e3ece8;
    --line: #dce3df;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121715; --surface: #1a201e; --ink: #e7ece9; --muted: #93a29c;
      --accent: #6fbfa8; --accent-ink: #0d1a16; --accent-soft: #1f2e29; --line: #2a322f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121715; --surface: #1a201e; --ink: #e7ece9; --muted: #93a29c;
    --accent: #6fbfa8; --accent-ink: #0d1a16; --accent-soft: #1f2e29; --line: #2a322f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif; line-height: 1.55;
    padding: 48px 20px 80px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .eyebrow {
    font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 10px;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: clamp(26px, 4vw, 32px); margin: 0 0 28px; text-wrap: balance;
  }
  .gate {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 32px; display: flex; flex-direction: column; gap: 14px; max-width: 420px;
  }
  .gate label { font-weight: 600; font-size: 14px; }
  .gate input {
    font-family: inherit; font-size: 14.5px; color: var(--ink); background: var(--accent-soft);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  .gate button, .refresh {
    font-family: inherit; font-weight: 600; font-size: 14.5px; color: var(--accent-ink);
    background: var(--accent); border: none; border-radius: 10px; padding: 12px 20px; cursor: pointer;
  }
  .gate .err { color: #b3432b; font-size: 13.5px; min-height: 1em; }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .tile .n { font-family: "Fraunces", Georgia, serif; font-size: 28px; font-variant-numeric: tabular-nums; }
  .tile .label { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
  .bar-row .name { flex: 0 0 220px; font-size: 13.5px; }
  .bar-track { flex: 1; height: 8px; background: var(--accent-soft); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); }
  .bar-row .val { flex: 0 0 34px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--muted); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px 26px; margin-bottom: 20px; }
  .panel h2 { font-family: "Fraunces", Georgia, serif; font-size: 18px; margin: 0 0 16px; }

  .entry { border-top: 1px solid var(--line); padding: 16px 0; }
  .entry:first-child { border-top: none; padding-top: 0; }
  .entry-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .entry-scores { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip { font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 10px; }
  .entry-obs { font-size: 14.5px; }
  .empty { color: var(--muted); font-size: 14px; }
  [hidden] { display: none !important; }
  .top-actions { display: flex; justify-content: flex-end; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Chatbox de apoyo · Tesis de maestría</div>
  <h1>Resultados de la evaluación clínica</h1>

  <div class="gate" id="gate">
    <label for="token">Token de administrador</label>
    <input type="password" id="token" placeholder="Pega tu ADMIN_TOKEN" />
    <div class="err" id="gate-err"></div>
    <button id="gate-btn">Ver resultados</button>
  </div>

  <div id="results" hidden>
    <div class="top-actions"><button class="refresh" id="refresh-btn">Actualizar</button></div>
    <div class="summary" id="summary"></div>
    <div class="panel">
      <h2>Promedio por criterio (sobre 5)</h2>
      <div id="bars"></div>
    </div>
    <div class="panel">
      <h2>Observaciones</h2>
      <div id="entries"></div>
    </div>
  </div>
</div>

<script>
  const CRITERIA = [
    ["risk_detection", "Detección de riesgo"],
    ["empathy", "Empatía"],
    ["coherence", "Coherencia clínica"],
    ["clarity", "Claridad del lenguaje"],
    ["usefulness", "Utilidad general"],
  ];

  const gate = document.getElementById("gate");
  const results = document.getElementById("results");
  const tokenInput = document.getElementById("token");
  const gateErr = document.getElementById("gate-err");

  function getToken() {
    return sessionStorage.getItem("admin_token") || "";
  }

  async function loadResults(token) {
    gateErr.textContent = "";
    const res = await fetch("/api/feedback", { headers: { "x-admin-token": token } });
    if (res.status === 403) {
      gateErr.textContent = "Token inválido.";
      sessionStorage.removeItem("admin_token");
      return;
    }
    if (!res.ok) {
      gateErr.textContent = "No se pudo cargar la información.";
      return;
    }
    const data = await res.json();
    sessionStorage.setItem("admin_token", token);
    render(data);
    gate.hidden = true;
    results.hidden = false;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function render(data) {
    document.getElementById("summary").innerHTML = `
      <div class="tile"><div class="n">${data.count}</div><div class="label">Evaluaciones recibidas</div></div>
    `;

    const barsEl = document.getElementById("bars");
    barsEl.innerHTML = data.count === 0
      ? '<p class="empty">Todavía no hay evaluaciones.</p>'
      : CRITERIA.map(([key, label]) => {
          const avg = data.averages[key] || 0;
          const pct = (avg / 5) * 100;
          return `<div class="bar-row">
            <div class="name">${label}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="val">${avg.toFixed(1)}</div>
          </div>`;
        }).join("");

    const entriesEl = document.getElementById("entries");
    const entries = [...data.entries].reverse();
    entriesEl.innerHTML = entries.length === 0
      ? '<p class="empty">Todavía no hay observaciones.</p>'
      : entries.map((e) => {
          const date = e.timestamp ? new Date(e.timestamp * 1000).toLocaleString("es-CO") : "";
          const who = escapeHtml(e.rater_name && e.rater_name.trim() ? e.rater_name : "Anónimo");
          const chips = CRITERIA.map(([key, label]) => `<span class="chip">${label}: ${e[key]}/5</span>`).join("");
          const obs = e.observations && e.observations.trim() ? escapeHtml(e.observations) : "<em>Sin observaciones.</em>";
          return `<div class="entry">
            <div class="entry-head"><span>${who}</span><span>${date}</span></div>
            <div class="entry-scores">${chips}</div>
            <div class="entry-obs">${obs}</div>
          </div>`;
        }).join("");
  }

  document.getElementById("gate-btn").addEventListener("click", () => {
    const t = tokenInput.value.trim();
    if (!t) { gateErr.textContent = "Ingresa el token."; return; }
    loadResults(t);
  });
  tokenInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("gate-btn").click();
  });
  document.getElementById("refresh-btn").addEventListener("click", () => loadResults(getToken()));

  const saved = getToken();
  if (saved) loadResults(saved);
</script>
</body>
</html>
